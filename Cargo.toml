[workspace]
resolver = "2"
members = ["crates/qrtx-protocol", "crates/qrtx-core", "crates/qrtx-runtime", "cli", "desktop/src-tauri", "crates/qrtx-android"]
default-members = ["crates/qrtx-protocol", "crates/qrtx-core", "crates/qrtx-runtime", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
ciborium = "=0.2.2"
tokio = { version = "=1.53.2", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
