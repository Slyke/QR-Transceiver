name: Android
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: cargo test --locked -p qrtx-android
      - run: cargo clippy --locked -p qrtx-android --all-targets -- -D warnings
      - run: bash scripts/build-android.sh testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qr-transceiver-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
