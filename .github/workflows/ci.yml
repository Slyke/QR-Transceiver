name: Verify and build
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libv4l-dev
      - run: npm --prefix desktop ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked -p qrtx-runtime --features camera
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked -p qrtransceiver --features camera
      - run: cargo build --locked -p qrtx-desktop
