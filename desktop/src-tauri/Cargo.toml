[package]
name = "qrtx-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "qrtx_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-window-state = "=2.5.0"
qrtx-core = { path = "../../crates/qrtx-core" }
qrtx-runtime = { path = "../../crates/qrtx-runtime", features = ["camera"] }
serde_json.workspace = true
tokio.workspace = true

clap = { version = "=4.6.7", features = ["derive"] }
